<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff003c"/>
      <stop offset="100%" style="stop-color:#0047ff"/>
    </linearGradient>
    <filter id="gf"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a14"/>
  <!-- Glow effect -->
  <rect width="64" height="64" rx="12" fill="url(#fg)" opacity="0.15"/>
  <!-- Border -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="url(#fg)" stroke-width="1.5" opacity="0.7"/>
  <!-- AM text -->
  <text x="50%" y="43" text-anchor="middle" font-family="'Arial Black', sans-serif"
    font-weight="900" font-size="28" fill="url(#fg)">AM</text>
  <!-- Neon line -->
  <line x1="8" y1="50" x2="56" y2="50" stroke="url(#fg)" stroke-width="1.5" opacity="0.5"/>
</svg>
