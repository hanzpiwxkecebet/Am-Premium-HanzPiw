<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AM Premium Free Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff003c;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#7700ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0047ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Circuit line decorations -->
  <line x1="0" y1="40" x2="12" y2="40" stroke="#ff003c" stroke-width="1.5" opacity="0.6"/>
  <circle cx="14" cy="40" r="2" fill="#ff003c" opacity="0.8"/>
  <line x1="290" y1="40" x2="320" y2="40" stroke="#0047ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="288" cy="40" r="2" fill="#0047ff" opacity="0.8"/>

  <!-- AM text - main logo letters -->
  <text x="18" y="56" font-family="'Arial Black', sans-serif" font-weight="900" font-size="46"
    fill="url(#logoGrad)" filter="url(#glow)">AM</text>

  <!-- Divider line -->
  <line x1="112" y1="15" x2="112" y2="65" stroke="url(#logoGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Text block -->
  <text x="122" y="36" font-family="'Arial', sans-serif" font-weight="800" font-size="15"
    letter-spacing="3" fill="#ffffff" opacity="0.95">PREMIUM FREE</text>
  <text x="122" y="58" font-family="'Arial', sans-serif" font-weight="500" font-size="12"
    letter-spacing="2" fill="#888899">by HanzPiw</text>

  <!-- Motion lines (decorative) -->
  <line x1="122" y1="43" x2="295" y2="43" stroke="url(#logoGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Small neon dots -->
  <circle cx="290" cy="25" r="2.5" fill="#ff003c" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="300" cy="40" r="2.5" fill="#7700ff" opacity="0.7" filter="url(#glow2)"/>
  <circle cx="290" cy="55" r="2.5" fill="#0047ff" opacity="0.7" filter="url(#glow2)"/>
</svg>
