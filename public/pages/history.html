<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/js/background.js?v=6"></script>
  <script src="/assets/js/dash-style.js?v=6"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
  <link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <title>History - AM Premium Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=6">
  <style>
    .filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn { flex-shrink: 0; padding: 6px 14px; border-radius: var(--radius-full); border: 1px solid var(--border-glass); background: var(--bg-glass); font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-secondary); transition: var(--transition); white-space: nowrap; }
    .filter-btn.active { background: rgba(156, 156, 156,0.1); border-color: var(--border-neon-red); color: var(--text-primary); }
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-wrap input { padding-left: 36px; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }
    .history-item { padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-glass); background: var(--bg-glass); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: var(--transition); }
    .history-item:hover { background: var(--bg-glass-hover); border-color: var(--border-neon-blue); }
    .history-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-completed { background: var(--text-success); box-shadow: 0 0 6px var(--text-success); }
    .status-failed { background: var(--text-error); box-shadow: 0 0 6px var(--text-error); }
    .status-pending, .status-waiting_verification { background: var(--text-warning); box-shadow: 0 0 6px var(--text-warning); }
    .history-info { flex: 1; min-width: 0; }
    .history-id { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-time { font-size: 0.8rem; color: var(--text-secondary); }
    .history-duration { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .history-method { font-size: 0.72rem; padding: 2px 8px; border-radius: var(--radius-full); border: 1px solid var(--border-glass); background: var(--bg-glass); color: var(--text-secondary); }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <div id="toast-container"></div>

  <div class="page-content">
    <div class="page-header">
      <div>
        <div class="page-title gradient-text">History <i class="ic ic-clock"></i></div>
        <div class="page-subtitle">Riwayat aktivitas generator</div>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon"><i class="ic ic-search"></i></span>
      <input type="text" class="form-input" id="search-input" placeholder="Cari berdasarkan ID...">
    </div>

    <!-- Filters -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">Semua</button>
      <button class="filter-btn" data-filter="completed">Berhasil</button>
      <button class="filter-btn" data-filter="failed">Gagal</button>
      <button class="filter-btn" data-filter="today">Hari Ini</button>
    </div>

    <!-- Summary -->
    <div class="grid-2 mb-2" id="history-summary" style="display:none">
      <div class="stat-card glass-card">
        <div class="stat-number text-success" id="sum-success">0</div>
        <div class="stat-label">Berhasil</div>
      </div>
      <div class="stat-card glass-card">
        <div class="stat-number text-error" id="sum-failed">0</div>
        <div class="stat-label">Gagal</div>
      </div>
    </div>

    <!-- History List -->
    <div id="history-list">
      <div class="skeleton" style="height:60px;border-radius:var(--radius-md);margin-bottom:8px"></div>
      <div class="skeleton" style="height:60px;border-radius:var(--radius-md);margin-bottom:8px"></div>
      <div class="skeleton" style="height:60px;border-radius:var(--radius-md)"></div>
    </div>
  </div>

  <nav id="bottom-nav"></nav>

  <script src="/assets/js/boot.js"></script>

  <script src="/assets/js/theme.js"></script>
  <script>Theme.init();</script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="/assets/js/particles.js"></script>
  <script src="/assets/js/firebase-init.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/topbar.js?v=6"></script>
  <script>
    let allHistory = [];
    let activeFilter = 'all';
    let searchQuery = '';

    function renderHistory(items) {
      const container = document.getElementById('history-list');
      if (items.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-icon"><i class="ic ic-clock"></i></div><div>Belum ada riwayat</div></div>`;
        return;
      }

      const today = new Date().toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta' });

      container.innerHTML = items.map(item => {
        const statusClass = `status-${item.status || 'pending'}`;
        const methodLabel = item.method === 'system' ? '<i class="ic ic-bookmark"></i> Sistem' : '<i class="ic ic-mail"></i> Custom';
        return `
          <div class="history-item" data-id="${Utils.escapeHtml(item.id)}">
            <div class="history-status-dot ${statusClass}"></div>
            <div class="history-info">
              <div class="history-id">#${Utils.escapeHtml(item.id)}</div>
              <div class="history-time">${Utils.formatDate(item.createdAt)}</div>
              <div class="history-duration">${Utils.formatDuration(item.duration)}</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
              ${Utils.getStatusBadge(item.status)}
              <span class="history-method">${methodLabel}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilter() {
      const todayStart = new Date();
      todayStart.setHours(0,0,0,0);

      let filtered = allHistory.filter(item => {
        if (activeFilter === 'completed') return item.status === 'completed';
        if (activeFilter === 'failed') return item.status === 'failed';
        if (activeFilter === 'today') return item.createdAt >= todayStart.getTime();
        return true;
      });

      if (searchQuery) {
        filtered = filtered.filter(item => String(item.id || '').toLowerCase().includes(searchQuery.toLowerCase()));
      }

      const success = filtered.filter(i => i.status === 'completed').length;
      const failed = filtered.filter(i => i.status === 'failed').length;
      Utils.animateNumber(document.getElementById('sum-success'), Number(document.getElementById('sum-success').textContent) || 0, success, 500);
      Utils.animateNumber(document.getElementById('sum-failed'), Number(document.getElementById('sum-failed').textContent) || 0, failed, 500);
      document.getElementById('history-summary').style.display = filtered.length ? 'grid' : 'none';

      renderHistory(filtered);
    }

    window.showDetail = function(id) {
      const item = allHistory.find(i => i.id === id);
      if (!item) return;
      const safeId = Utils.escapeHtml(id);
      Utils.createModal(`Detail #${Utils.escapeHtml(id.substring(0,12))}...`, `
        <div style="display:flex;flex-direction:column;gap:10px;font-size:0.88rem">
          <div class="flex justify-between"><span class="text-secondary">Status</span>${Utils.getStatusBadge(item.status)}</div>
          <div class="flex justify-between"><span class="text-secondary">Waktu</span><span>${Utils.formatDate(item.createdAt)}</span></div>
          <div class="flex justify-between"><span class="text-secondary">Selesai</span><span>${Utils.formatDate(item.completedAt)}</span></div>
          <div class="flex justify-between"><span class="text-secondary">Durasi</span><span>${Utils.formatDuration(item.duration)}</span></div>
          <div class="flex justify-between"><span class="text-secondary">Metode</span><span>${item.method === 'system' ? 'Email Sistem' : 'Email Sendiri'}</span></div>
          <div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted);word-break:break-all">ID: ${safeId}</div>
        </div>
      `, [{ label: 'Tutup', action: 'close', class: 'btn-primary' }]);
    };

    document.addEventListener('DOMContentLoaded', async () => {
      try { initParticles(); } catch (e) { /* abaikan */ }
      Nav.init('history');

      let user = null;
      try {
        user = await Auth.init({ waitProfile: false });
      } catch (err) {
        console.error('[history] Auth error:', err);
        Toast.error(err.message || 'Gagal terhubung. Coba refresh halaman.');
        return;
      }
      if (!user) { window.location.href = '/login'; return; }

      // Klik item history (delegasi event, aman dari karakter aneh di ID)
      document.getElementById('history-list').addEventListener('click', (e) => {
        const el = e.target.closest('.history-item');
        if (el && el.dataset.id) window.showDetail(el.dataset.id);
      });

      // Filters
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.dataset.filter;
          applyFilter();
        });
      });

      // Search
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', Utils.debounce(() => {
        searchQuery = searchInput.value.trim();
        applyFilter();
      }, 300));

      // Load history: tampil dari cache seketika, lalu segarkan di belakang layar
      async function loadHistory() {
        try {
          await Cache.swr(
            'history:' + user.uid,
            async () => (await AMApp.apiCall('GET', '/api/generator/history')).data || [],
            (data) => { allHistory = data; applyFilter(); }
          );
        } catch (err) {
          Toast.error('Gagal memuat history');
          Utils.renderError(document.getElementById('history-list'), err.message, loadHistory);
        }
      }
      loadHistory();
    });
  </script>
  <script src="/assets/js/backsound.js?v=4"></script>
</body>
</html>
