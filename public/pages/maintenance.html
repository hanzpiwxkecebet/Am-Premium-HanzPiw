<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/js/background.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Maintenance - AM Premium Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .maint-container { text-align: center; padding: 32px 24px; max-width: 400px; width: 100%; z-index: 1; position: relative; }
    .maint-logo { width: 80px; height: 80px; margin: 0 auto 24px; position: relative; }
    .maint-logo-ring { width: 80px; height: 80px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--neon-red); border-left-color: var(--neon-blue); animation: maintspin 2s linear infinite; position: absolute; top: 0; left: 0; }
    .maint-logo-inner { width: 60px; height: 60px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; position: absolute; top: 10px; left: 10px; }
    @keyframes maintspin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .maint-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; }
    .maint-subtitle { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6; }
    .maint-message { background: var(--bg-glass); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 24px; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.7; min-height: 48px; }
    .maint-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
    .maint-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-glass); animation: maintpulse 1.5s ease-in-out infinite; }
    .maint-dot:nth-child(2) { animation-delay: 0.2s; }
    .maint-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes maintpulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); background: var(--neon-red); } }
    .maint-credit { font-size: 0.72rem; color: var(--text-muted); }
    .maint-credit a { color: var(--neon-blue); text-decoration: none; }
    .retry-btn { margin-top: 16px; }
    .timer-display { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <div class="maint-container">
    <div class="maint-logo">
      <div class="maint-logo-ring"></div>
      <div class="maint-logo-inner"><i class="ic ic-wrench"></i></div>
    </div>

    <div class="maint-title gradient-text">Under Maintenance</div>
    <div class="maint-subtitle">Sistem sedang dalam pemeliharaan.<br>Kami akan kembali secepatnya.</div>

    <div class="maint-message" id="maint-message">
      Mohon maaf atas ketidaknyamanan ini. Tim kami sedang bekerja keras untuk meningkatkan layanan.
    </div>

    <div class="maint-dots">
      <div class="maint-dot"></div>
      <div class="maint-dot"></div>
      <div class="maint-dot"></div>
    </div>

    <button class="btn btn-secondary retry-btn" onclick="checkStatus()">
      <span class="btn-text"><i class="ic ic-refresh"></i> Cek Status</span>
    </button>

    <div class="timer-display" id="retry-timer">Auto-check dalam <span id="countdown">30</span>s</div>

    <div class="maint-credit" style="margin-top:24px">
      Developed by <a href="https://instagram.com/itshanzpiw" target="_blank">@itshanzpiw</a><br>
      AM Premium Generator V2.0 Beta
    </div>
  </div>

  <script src="/assets/js/boot.js"></script>

  <script src="/assets/js/theme.js"></script>
  <script>Theme.init();</script>
  <script src="/assets/js/particles.js"></script>
  <script>
    initParticles();

    let countdown = 30;
    let timer;

    // Set message from URL params
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('message');
    if (msg) {
      document.getElementById('maint-message').textContent = msg; // URLSearchParams sudah men-decode
    }

    async function checkStatus() {
      clearInterval(timer);
      countdown = 30;
      document.getElementById('countdown').textContent = countdown;

      try {
        const res = await fetch('/api/public/status');
        const data = await res.json();
        if (!(data.data && data.data.maintenance)) {
          window.location.href = '/';
        }
      } catch (e) {
        // still in maintenance or unreachable
      }

      startTimer();
    }

    function startTimer() {
      timer = setInterval(() => {
        countdown--;
        document.getElementById('countdown').textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timer);
          checkStatus();
        }
      }, 1000);
    }

    startTimer();
  </script>
  <script src="/assets/js/backsound.js?v=4"></script>
</body>
</html>
