<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/assets/js/background.js?v=6"></script>
  <script src="/assets/js/dash-style.js?v=6"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AM Premium">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AM Premium Generator</title>
  <script>
    // Salinan shell yang ter-load DI DALAM iframe (mis. halaman memanggil window.location.href = '/dashboard'):
    // langsung arahkan ke versi halaman asli (?_embed=1). Kalau _embed sudah ada tapi masih shell, berhenti (cegah loop).
    (function () {
      if (window.top === window) {
        if (location.pathname === '/shell.html') location.replace('/dashboard');
        return;
      }
      document.documentElement.style.display = 'none';
      var u = new URL(location.href);
      if (u.searchParams.has('_embed')) return;
      u.searchParams.set('_embed', '1');
      location.replace(u.pathname + u.search + u.hash);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/main.css?v=10">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #app-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: transparent; opacity: 1; transition: opacity 0.2s ease; }
    #app-frame.leaving { opacity: 0; transition-duration: 0.12s; }
    @media (prefers-reduced-motion: reduce) { #app-frame, #app-frame.leaving { transition: none; } }
  </style>
</head>
<body>
  <iframe id="app-frame" title="AM Premium Generator" allow="clipboard-read; clipboard-write; fullscreen; web-share"></iframe>

  <script src="/assets/js/theme.js"></script>
  <script>try { Theme.init(); } catch (e) { /* abaikan */ }</script>
  <!-- Urutan penting: backsound dulu (hidup di halaman induk ini, tidak pernah reload), baru shell -->
  <script src="/assets/js/backsound.js?v=5"></script>
  <script src="/assets/js/shell.js"></script>
</body>
</html>
