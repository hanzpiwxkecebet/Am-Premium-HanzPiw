<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AM Premium Generator</title>
  <script>
    // Salinan shell yang ter-load DI DALAM iframe (mis. halaman memanggil window.location.href = '/dashboard'):
    // langsung arahkan ke versi halaman asli (?_embed=1). Kalau _embed sudah ada tapi masih shell, berhenti (cegah loop).
    (function () {
      if (window.top === window) {
        if (location.pathname === '/shell.html') location.replace('/dashboard');
        return;
      }
      document.documentElement.style.display = 'none';
      var u = new URL(location.href);
      if (u.searchParams.has('_embed')) return;
      u.searchParams.set('_embed', '1');
      location.replace(u.pathname + u.search + u.hash);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #app-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <iframe id="app-frame" title="AM Premium Generator" allow="clipboard-read; clipboard-write; fullscreen; web-share"></iframe>

  <script src="/assets/js/theme.js"></script>
  <script>try { Theme.init(); } catch (e) { /* abaikan */ }</script>
  <!-- Urutan penting: backsound dulu (hidup di halaman induk ini, tidak pernah reload), baru shell -->
  <script src="/assets/js/backsound.js"></script>
  <script src="/assets/js/shell.js"></script>
</body>
</html>
